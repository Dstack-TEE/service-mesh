name: Publish service-mesh images

# Builds and publishes the four container images the service-mesh
# example needs (mesh-sidecar, patroni, webdemo, signaling). On push
# to main, images are tagged with the commit SHA *and* `latest`,
# pushed to GHCR, and attested with Sigstore-backed GitHub Build
# Provenance so consumers can verify "this image came from this
# commit of this repo" without us managing any keys. PRs build to
# verify but do not push or attest.
#
# Why one workflow for all four: the example needs them in lockstep —
# bumping one but leaving the rest stale leads to mixed-version
# clusters that are hard to reason about. One workflow means one set
# of tags moves together.
#
# `mesh-sidecar` is the consolidated platform-plumbing image. Its build
# context is the repository root so its Dockerfile
# can pull Go sources from component subdirs. The other three images
# build from their workload/component subdirs.
#
# Verifying a published image (consumer side):
#
#   gh attestation verify \
#     oci://ghcr.io/dstack-tee/service-mesh/mesh-sidecar:latest \
#     --repo Dstack-TEE/service-mesh

on:
  push:
    branches: [main]
    paths:
      - 'components/bootstrap-secrets/**'
      - 'components/admission-broker/**'
      - 'components/admission-client/**'
      - 'components/mesh-conn/**'
      - 'components/mesh-sidecar/**'
      - 'components/signaling/**'
      - 'workloads/patroni/**'
      - 'workloads/webdemo/**'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'components/bootstrap-secrets/**'
      - 'components/admission-broker/**'
      - 'components/admission-client/**'
      - 'components/mesh-conn/**'
      - 'components/mesh-sidecar/**'
      - 'components/signaling/**'
      - 'workloads/patroni/**'
      - 'workloads/webdemo/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token + attestations are required for Sigstore-backed
      # GitHub Build Provenance via actions/attest-build-provenance.
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # `mesh-sidecar` builds with the parent dir as context so
          # its Dockerfile can pull Go sources from components/.
          - name: mesh-sidecar
            context: .
            dockerfile: components/mesh-sidecar/Dockerfile
          - name: patroni
            context: ./workloads/patroni
          - name: webdemo
            context: ./workloads/webdemo
          - name: signaling
            context: ./components/signaling

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Images are published under the repository package namespace:
          # ghcr.io/<owner>/<repo>/<name>
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Most images use the default Dockerfile in the context.
          # `mesh-sidecar` overrides this to point at
          # components/mesh-sidecar/Dockerfile while keeping the parent context.
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=service-mesh-${{ matrix.name }}
          cache-to: type=gha,scope=service-mesh-${{ matrix.name }},mode=max

      # Sigstore-backed build provenance. Binds {image digest, repo,
      # workflow, commit SHA, runner identity} into an attestation
      # signed with a short-lived Sigstore cert obtained via this
      # workflow's GitHub OIDC token — no keys we have to rotate. The
      # attestation is uploaded to GitHub *and* (via push-to-registry)
      # written next to the image on GHCR so `gh attestation verify
      # oci://...` and `cosign verify-attestation` both work.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
