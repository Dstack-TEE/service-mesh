name: Protocol verification

on:
  pull_request:
    paths:
      - 'protocol/**'
      - 'components/mesh-conn/**'
      - 'components/admission-broker/**'
      - 'components/admission-client/**'
      - '.github/workflows/protocol.yml'
  push:
    branches: [main]
    paths:
      - 'protocol/**'
      - 'components/mesh-conn/**'
      - 'components/admission-broker/**'
      - 'components/admission-client/**'
      - '.github/workflows/protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check models, witnesses, and expected counterexamples
        run: python3 protocol/check.py
      - name: Save TLC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-model-checks
          path: .local/protocol-checks/
          include-hidden-files: true
          if-no-files-found: warn

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check unbounded signaling proof and all axiom dependencies
        run: python3 protocol/proof/check.py
      - name: Save Lean evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-lean-proof
          path: .local/protocol-proof/
          include-hidden-files: true
          if-no-files-found: warn
